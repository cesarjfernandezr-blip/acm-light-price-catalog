<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7f4"><title>Precios HEINE y ARC · Miami</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;650;700;750&display=swap" rel="stylesheet"><style>.summary{display:none!important}:root{--ink:#26383a;--muted:#718487;--line:#e6eceb;--paper:#fff;--bg:#fbfcfb;--green:#b0d236;--teal:#1c828b;--mint:#f1f7df;--gold:#b0d236}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1120px;margin:auto;padding:38px 26px 72px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:60px}.brand{display:flex;gap:11px;align-items:center;font-size:14px;font-weight:750;letter-spacing:.04em}.mark{width:36px;height:36px;border-radius:12px;background:var(--green);color:white;display:grid;place-items:center;font-size:17px}.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:9px 13px;border-radius:99px;background:#ffffffa8}.hero{max-width:670px;margin-bottom:34px}.eyebrow{color:var(--green);font-weight:750;font-size:12px;letter-spacing:.16em;text-transform:uppercase}.hero h1{font:600 clamp(38px,6vw,66px)/1.08 Montserrat,ui-sans-serif,system-ui,sans-serif;color:var(--teal);letter-spacing:-.045em;margin:16px 0}.hero p{font-size:16px;line-height:1.7;color:var(--muted);max-width:510px}.toolbar{display:flex;gap:12px;align-items:center;margin:34px 0 18px}.search{height:46px;flex:1;max-width:420px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 15px;font:inherit;color:var(--ink);outline:none}.search:focus{border-color:#b0d236;box-shadow:0 0 0 3px #235a4d12}.count{color:var(--muted);font-size:13px}.section{margin-top:30px}.sectionhead{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 12px}.sectionhead h2{font:600 27px Montserrat,ui-sans-serif,system-ui,sans-serif;color:var(--teal);margin:0}.sectionhead span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:17px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;transition:transform .15s,border .15s}.card:hover{transform:transla</style></head><body><main class="wrap"><header class="top"><div class="brand"><div class="mark">✳</div><span>ACM LIGHT, LLC</span></div><div class="tag">Miami · Lista de precios</div></header><section class="hero"><div class="eyebrow">Catálogo de productos</div><h1>Precios claros.<br>Selección sencilla.</h1><p>Consulta el precio de venta y ajusta la cantidad de cada producto. El importe por artículo y el total se calculan automáticamente.</p></section><div class="toolbar"><input id="search" class="search" type="search" placeholder="Buscar por nombre o referencia…" aria-label="Buscar productos"><span id="count" class="count"></span></div><div id="catalog"></div><footer class="foot">Precios de venta en USD · Miami</footer></main><script>const products=[{"brand": "HEINE", "ref": "C-002.17.080", "name": "TRANSILUM.FINOFF 3,5 V", "price": 156.96, "qty": 2}, {"brand": "HEINE", "ref": "X-007.99.388", "name": "MANGO REC.BETA 4 USB+CA.+TR.", "price": 443.52, "qty": 5}, {"brand": "HEINE", "ref": "C-008.33.614", "name": "OMEGA 600 STUDENT SET", "price": 4970.88, "qty": 1}, {"brand": "HEINE", "ref": "C-008.33.612", "name": "OMEGA 600 WALL CHARGER SET", "price": 5143.68, "qty": 1}, {"brand": "HEINE", "ref": "F-120.18.860", "name": "EQUIPO GR.P.LARING. F120-", "price": 1478.88, "qty": 1}, {"brand": "HEINE", "ref": "C-014.10.118", "name": "BETA 200 LED RETINOSC./BETA ΜΑ.", "price": 853.92, "qty": 1}, {"brand": "HEINE", "ref": "C-008.15.353", "name": "RETINOSC.FRANJA BETA200 LED", "price": 796.32, "qty": 1}, {"brand": "HEINE", "ref": "D-008.71.120", "name": "OFTALMOSCOPIO MINI3000 LED+MA", "price": 347.04, "qty": 3}, {"brand": "HEINE", "ref": "C-000.33.010", "name": "ENTRENADOR DE OFTALMOLOGIA", "price": 480.96, "qty": 1}, {"brand": "HEINE", "ref": "C-002.14.602", "name": "LAMPARA DE HENDIDURA HSL 150", "price": 1116.0, "qty": 1}, {"brand": "HEINE", "ref": "C-000.33.212", "name": "TM-2, HEINE", "price": 187.2, "qty": 2}, {"brand": "HEINE", "ref": "C-008.30.120", "name": "Oftalmoscopio Beta, 200S LED, HEINE", "price": 1180.8, "qty": 2}, {"brand": "HEINE", "ref": "C-008.30.100", "name": "Oftalmoscopio Beta, 200 LED, HEINE", "price": 1092.0, "qty": 1}, {"brand": "HEINE", "ref": "X-007.99.383", "name": "Bateria recargable LI-ION L, HEINE", "price": 236.4, "qty": 1}, {"brand": "HEINE", "ref": "C-145.00.000", "name": "Estuche rigido HEINE", "price": 153.6, "qty": 2}, {"brand": "HEINE", "ref": "A-132.28.388", "name": "Beta 200 LED OPH/OT. Set/4USB+TR HEINE", "price": 2534.4, "qty": 1}, {"brand": "HEINE", "ref": "X-007.99.686", "name": "LION Batery REC.Mpack V2.0 HEINE", "price": 441.6, "qty": 1}, {"brand": "HEINE", "ref": "C-008.33.341", "name": "Sigma 250+S+Frame+Mpack HEINE", "price": 5018.4, "qty": 1}, {"brand": "HEINE", "ref": "X-002.99.395", "name": "Pieza de Fondo Beta 4USB HEINE", "price": 228.0, "qty": 2}, {"brand": "HEINE", "ref": "C-000.33.302", "name": "Cabezal Coobserva Sigma HEINE", "price": 110.4, "qty": 1}, {"brand": "HEINE", "ref": "D-001.71.120", "name": "Oftalmoscopio Mini3000+Mango HEINE", "price": 528.0, "qty": 1}, {"brand": "HEINE", "ref": "D-001.71.220", "name": "Otoscopio Mini 3000+Mango+Tips HEINE", "price": 302.4, "qty": 1}, {"brand": "HEINE", "ref": "X-007.99.671", "name": "Mpack con Bat. Heine", "price": 1027.2, "qty": 1}, {"brand": "HEINE", "ref": "C-000.32.356", "name": "HR2,5X420+I-VIEW EN S-FRAME Heine", "price": 3156.0, "qty": 1}, {"brand": "HEINE", "ref": "Z-300.00.256", "name": "LINSE 0 DIOPTRIEN (Lente 0 dioptrias)", "price": 16.56, "qty": 1}, {"brand": "HEINE", "ref": "Z-300.00.237", "name": "KORREKTURLINSE +2D (Lente de corrección +2 dioptrías)", "price": 16.56, "qty": 1}, {"brand": "ARC", "ref": "HS11025s", "name": "Cyclo Probe, Sterile (5 Pcs)", "price": 1275.0, "qty": 1}, {"brand": "ARC", "ref": "LL13025s", "name": "Endo Probe, 23 G, curved, sterile (5 Pcs)", "price": 1335.0, "qty": 1}, {"brand": "ARC", "ref": "LL13006s", "name": "Endo Probe, 23 G, straight, Sterile (5 Pcs)", "price": 1335.0, "qty": 1}, {"brand": "ARC", "ref": "LL13010s", "name": "Endo Probe, 25 G, straight, sterile (5 Pcs)", "price": 1560.0, "qty": 2}, {"brand": "ARC", "ref": "WE01436", "name": "CERAMIC BLADE, STERILE", "price": 35.0, "qty": 1}];const quantities=Object.fromEntries(products.map((p,i)=>[i,p.qty]));const money=n=>new Intl.NumberFormat('es-US',{style:'currency',currency:'USD'}).format(n);function render(){const q=document.querySelector('#search').value.trim().toLocaleLowerCase('es');const shown=products.map((p,i)=>({...p,i})).filter(p=>(p.name+' '+p.ref+' '+p.brand).toLocaleLowerCase('es').includes(q));document.querySelector('#count').textContent=`${shown.length} productos`;let groups={};shown.forEach(p=>(groups[p.brand]??=[]).push(p));document.querySelector('#catalog').innerHTML=Object.entries(groups).map(([brand,items])=>`<section class="section"><div class="sectionhead"><h2>${brand}</h2><span>${items.length} artículos</span></div><div class="grid">${items.map(p=>`<article class="card"><div><div class="ref">${p.ref}</div><div class="name">${p.name}</div></div><div class="right"><div class="price">${money(p.price)} <small>USD</small></div><div class="qty"><button aria-label="Disminuir cantidad" onclick="change(${p.i},-1)">−</button><input aria-label="Cantidad" type="number" min="0" step="1" value="${quantities[p.i]}" onchange="setQty(${p.i},this.value)"><button aria-label="Aumentar cantidad" onclick="change(${p.i},1)">+</button></div><div class="subtotal">Importe: ${money(p.price*quantities[p.i])}</div></div></article>`).join('')}</div></section>`).join('')||'<div class="empty">No se encontraron productos.</div>';updateTotal()}function setQty(i,v){quantities[i]=Math.max(0,Math.floor(Number(v)||0));render()}function change(i,n){quantities[i]=Math.max(0,quantities[i]+n);render()}function updateTotal(){let total=products.reduce((a,p,i)=>a+p.price*quantities[i],0);document.querySelector('#grandtotal').textContent=money(total)}document.querySelector('#search').addEventListener('input',render);const bar=document.createElement('aside');bar.className='summary';bar.innerHTML='<div><div class="label">Total de la selección</div><div class="total" id="grandtotal"></div></div><button onclick="window.print()">Imprimir / Guardar PDF</button>';document.querySelector('main').insertBefore(bar,document.querySelector('.foot'));render();const toggleTotal=document.createElement('button');toggleTotal.textContent='Mostrar total de la selección';toggleTotal.setAttribute('aria-expanded','false');toggleTotal.style.cssText='display:block;margin:18px auto 0;border:1px solid #b0d236;background:#fff;color:#1c828b;border-radius:10px;padding:11px 16px;font:600 13px Montserrat,ui-sans-serif,system-ui,sans-serif;cursor:pointer';bar.style.setProperty('display','none','important');toggleTotal.onclick=()=>{const visible=bar.style.display!=='flex';bar.style.setProperty('display',visible?'flex':'none','important');toggleTotal.textContent=visible?'Ocultar total':'Mostrar total de la selección';toggleTotal.setAttribute('aria-expanded',String(visible))};document.querySelector('main').insertBefore(toggleTotal,document.querySelector('.foot'));</script></body></html>
